name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: python -m pip install -r packages/resume-template/requirements.txt
      - run: dotnet restore my_resume_backend.sln --locked-mode || dotnet restore my_resume_backend.sln
      - run: dotnet build my_resume_backend.sln --no-restore --configuration Release --maxcpucount:1 -p:UseSharedCompilation=false
      - run: dotnet test tests/resume.Tests/resume.Tests.csproj --no-build --no-restore --configuration Release --maxcpucount:1
      - run: npm run pdf:generate
      - run: npm run pdf:qa
      - run: npm run build
      - run: npm run test
      - uses: actions/upload-artifact@v4
        with:
          name: verified-static-site-and-resumes
          path: |
            apps/public/out
            artifacts/pdf-qa/*/qa-report.json
          if-no-files-found: error
