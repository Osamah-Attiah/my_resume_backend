name: Export private resume PDF
on:
  workflow_dispatch:
    inputs:
      publication_id: { description: Private publication UUID, required: true }
      attempt_id: { description: Current attempt UUID, required: true }
      product_repository: { description: Public product repository owner/name, required: true }
      product_ref: { description: Pinned product commit SHA, required: true }
permissions:
  contents: read
concurrency:
  group: private-resume-${{ inputs.publication_id }}
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.product_repository }}
          ref: ${{ inputs.product_ref }}
          path: product
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: product/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
        working-directory: product
      - run: python -m pip install -r packages/resume-template/requirements.txt
        working-directory: product
      - name: Register workflow run
        continue-on-error: true
        env:
          API_ORIGIN: ${{ secrets.RESUME_API_ORIGIN }}
          CALLBACK_SECRET: ${{ secrets.RESUME_PUBLISHING_CALLBACK_SECRET }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
        run: >-
          curl --fail --silent --show-error -X POST
          -H "X-Publishing-Secret: ${CALLBACK_SECRET}"
          -H "Content-Type: application/json"
          --data "{\"state\":\"building\",\"workflowRunId\":\"${GITHUB_RUN_ID}\"}"
          "${API_ORIGIN}/api/v1/internal/publications/${PUBLICATION_ID}/attempts/${ATTEMPT_ID}/progress"
      - name: Fetch immutable private snapshot
        env:
          API_ORIGIN: ${{ secrets.RESUME_API_ORIGIN }}
          CALLBACK_SECRET: ${{ secrets.RESUME_PUBLISHING_CALLBACK_SECRET }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
        working-directory: product
        run: |
          mkdir -p artifacts
          curl --fail --silent --show-error -H "X-Publishing-Secret: ${CALLBACK_SECRET}" "${API_ORIGIN}/api/v1/internal/publications/${PUBLICATION_ID}/snapshot" --output artifacts/publication.json
      - name: Generate and verify private PDFs
        env:
          PUBLIC_SNAPSHOT_PATH: ${{ github.workspace }}/product/artifacts/publication.json
        working-directory: product
        run: |
          npm run pdf:generate
          curl --fail --silent --show-error -X POST \
            -H "X-Publishing-Secret: ${{ secrets.RESUME_PUBLISHING_CALLBACK_SECRET }}" \
            -H "Content-Type: application/json" \
            --data "{\"state\":\"validating\",\"workflowRunId\":\"${GITHUB_RUN_ID}\"}" \
            "${{ secrets.RESUME_API_ORIGIN }}/api/v1/internal/publications/${{ inputs.publication_id }}/attempts/${{ inputs.attempt_id }}/progress" || true
          npm run pdf:qa
      - name: Stage only final PDFs
        working-directory: product
        run: |
          mkdir -p artifacts/private-delivery
          cp artifacts/pdf-qa/ar/resume.pdf artifacts/private-delivery/resume-ar.pdf 2>/dev/null || true
          cp artifacts/pdf-qa/en/resume.pdf artifacts/private-delivery/resume-en.pdf 2>/dev/null || true
          test -n "$(find artifacts/private-delivery -name 'resume-*.pdf' -print -quit)"
      - name: Upload protected short-lived artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: private-resume-${{ inputs.publication_id }}
          path: product/artifacts/private-delivery/*.pdf
          if-no-files-found: error
          retention-days: 7
      - name: Build signed callback body
        env:
          GITHUB_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        working-directory: product
        run: node scripts/create-private-export-result.mjs
      - name: Retain private reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: private-resume-evidence-${{ inputs.publication_id }}
          path: product/artifacts/private-export-result.json
          if-no-files-found: error
          retention-days: 7
      - name: Mark export successful
        continue-on-error: true
        env:
          API_ORIGIN: ${{ secrets.RESUME_API_ORIGIN }}
          CALLBACK_SECRET: ${{ secrets.RESUME_PUBLISHING_CALLBACK_SECRET }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
        working-directory: product
        run: >-
          curl --fail --silent --show-error -X POST
          -H "X-Publishing-Secret: ${CALLBACK_SECRET}"
          -H "Content-Type: application/json"
          --data @artifacts/private-export-result.json
          "${API_ORIGIN}/api/v1/internal/publications/${PUBLICATION_ID}/attempts/${ATTEMPT_ID}/result"
      - name: Mark export failed
        if: failure()
        continue-on-error: true
        env:
          API_ORIGIN: ${{ secrets.RESUME_API_ORIGIN }}
          CALLBACK_SECRET: ${{ secrets.RESUME_PUBLISHING_CALLBACK_SECRET }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
        run: >-
          curl --fail --silent --show-error -X POST
          -H "X-Publishing-Secret: ${CALLBACK_SECRET}"
          -H "Content-Type: application/json"
          --data '{"state":"failed","errorCode":"PRIVATE_EXPORT_FAILED","errorSummary":"Private PDF generation or verification failed; inspect the private workflow log."}'
          "${API_ORIGIN}/api/v1/internal/publications/${PUBLICATION_ID}/attempts/${ATTEMPT_ID}/result"
