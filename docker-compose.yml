services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_resume}
      POSTGRES_USER: ${POSTGRES_USER:-resume_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_local_password}
    ports:
      - "54324:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
